# Root Bender manifest for the schnitzel project.
#
# Everything is consumed via three path dependencies. Each one is a small,
# focused sub-manifest the schnitzel build owns:
#
#   cva6           — schnitzel's curated cva6 file list; lives at
#                    src/main/resources/cva6/Bender.yml, co-located with the
#                    PMA override (cv64a6_imafdc_sv39_config_pkg.sv).
#   ibex           — schnitzel's curated ibex file list; lives at
#                    src/main/resources/ibex/Bender.yml.
#   schnitzel_rtl  — chisel-emitted Bender.yml at $SCHNITZEL_RTL_DIR. Re-emitted
#                    on every chisel build; module names drift, location can
#                    vary per kernel, so its path comes from an env var.
#
# Targets:
#   sim_top — pulls in the sim/rtl/ wrappers (TopWrapper, MemDpi). Drop with
#             a synth-time activation that omits this target.

package:
  name: schnitzel
  authors:
    - "Joren Dumoulin"
dependencies:
  cva6: {path: src/main/resources/cva6}
  ibex: {path: src/main/resources/ibex}
  schnitzel_rtl: {path: $SCHNITZEL_RTL_DIR}
sources:
  - target: sim_top
    files:
      - sim/rtl/TopWrapper.sv
      - sim/rtl/MemDpi.sv
