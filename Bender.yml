# Root Bender manifest for the schnitzel project.
#
# Flat enumeration of every cva6/ibex source file by path relative to the
# repo root — bender does not git-fetch and does not consume any downstream
# cva6/ibex Bender.yml's. All external sources live under submodules/cva6/
# (vendored or nested via cva6's own submodule tree) or submodules/ibex/.
# The schnitzel-owned cva6 PMA override (rtl/cva6/...) replaces cva6's
# stock cv64a6_imafdc_sv39_config_pkg.sv; only the override is listed.
#
# The single remaining dependency is `schnitzel_rtl`, a chisel-emitted
# Bender.yml that lives inside the generated/ tree. Its file list changes
# every chisel emit (module names drift, new modules appear), and its
# location varies per build (each kernel has its own generated/ dir), so
# it stays out of this static manifest and gets pulled in by path. The
# $SCHNITZEL_RTL_DIR env var tells bender where to find it.
#
# Targets:
#   sim_top — pulls in the sim/rtl/ wrappers (TopWrapper, MemDpi). Drop
#             with a synth-time activation that omits this target.

package:
  name: schnitzel
  authors:
    - "Joren Dumoulin"

dependencies:
  schnitzel_rtl: { path: $SCHNITZEL_RTL_DIR }

sources:
  - include_dirs:
      - submodules/cva6/core/include
      - submodules/cva6/vendor/pulp-platform/axi/include
      - submodules/cva6/vendor/pulp-platform/common_cells/include
      - submodules/cva6/common/local/util
      - submodules/ibex/dv/uvm/core_ibex/common/prim
      - submodules/ibex/formal/data_ind_timing
      - submodules/ibex/vendor/lowrisc_ip/dv/sv/dv_utils
      - submodules/ibex/vendor/lowrisc_ip/ip/prim/rtl
